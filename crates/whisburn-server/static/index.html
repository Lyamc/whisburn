<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>whisburn</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #161922;
      --surface-2: #1e2330;
      --border: #2c3344;
      --text: #eef1f7;
      --muted: #9aa3b8;
      --accent: #5b8def;
      --accent-hover: #4a7de0;
      --success: #3dd68c;
      --warning: #f5b942;
      --danger: #ff5c57;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(91, 141, 239, 0.16), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }
    .brand h1 { margin: 0; font-size: 1.55rem; font-weight: 650; letter-spacing: -0.03em; }
    .tagline { color: var(--muted); font-size: 0.95rem; margin: 6px 0 0; max-width: 38em; }
    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 6px 8px 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .status-dot.ok { background: var(--success); }
    .status-dot.busy { background: var(--warning); animation: pulse 1s infinite; }
    .status-dot.err { background: var(--danger); }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 18px;
      margin-bottom: 14px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 0.92rem;
      letter-spacing: 0;
      color: var(--text);
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: none;
    }
    .step-num {
      width: 22px; height: 22px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700; color: var(--muted);
      flex-shrink: 0;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
      header { flex-direction: column; }
      .header-status { align-self: stretch; justify-content: space-between; }
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
    .tab {
      padding: 8px 14px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
      flex: 1;
    }
    .tab.active { background: var(--surface-2); color: var(--text); font-weight: 600; }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--bg);
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(91, 141, 239, 0.08);
    }
    .dropzone p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .dropzone strong { color: var(--text); }
    .dropzone .hint { margin-top: 6px; font-size: 0.8rem; }
    .record-panel { text-align: center; padding: 20px 0; }
    .record-timer { font-size: 2.2rem; font-variant-numeric: tabular-nums; margin: 12px 0; font-weight: 600; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button, label.btn-secondary {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 550;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; min-width: 160px; padding: 12px 18px; font-size: 1rem; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: #2a3144; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .file-name { margin-top: 10px; font-size: 0.85rem; color: var(--muted); word-break: break-all; }
    audio { width: 100%; margin-top: 12px; border-radius: 8px; }
    textarea {
      width: 100%;
      min-height: 160px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 0.9rem;
      line-height: 1.55;
      resize: none;
      overflow-y: hidden;
      field-sizing: content;
    }
    @supports not (field-sizing: content) {
      textarea { resize: vertical; }
    }
    .status-line { font-size: 0.88rem; color: var(--muted); margin-top: 10px; min-height: 1.3em; }
    .progress-wrap { margin-top: 12px; }
    .progress-label {
      margin: 0 0 6px;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar.overall { height: 10px; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.15s ease;
    }
    .progress-fill.overall { background: linear-gradient(90deg, var(--accent), #8eb6ff); }
    .progress-text { margin: 6px 0 0; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .progress-block + .progress-block { margin-top: 12px; }
    .hidden { display: none !important; }
    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    label.tab { display: inline-block; cursor: pointer; }
    #model-meta { margin-top: 10px; font-size: 0.8rem; line-height: 1.6; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
    .meta-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .tier-good { color: var(--success); }
    .tier-mid { color: var(--warning); }
    .tier-bad { color: var(--danger); }
    .vram-ok { color: var(--success); }
    .vram-tight { color: var(--warning); }
    .vram-no { color: var(--danger); }
    .queue-list { list-style: none; margin: 0; padding: 0; }
    .queue-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 8px;
      font-size: 0.85rem;
      background: var(--bg);
    }
    .queue-item .q-name { flex: 1; word-break: break-all; }
    .queue-item .q-status { font-size: 0.75rem; font-weight: 650; letter-spacing: 0.02em; color: var(--muted); }
    .queue-item.processing { border-color: var(--accent); }
    .queue-item.processing .q-status { color: var(--accent); }
    .queue-item.done { border-color: rgba(61, 214, 140, 0.45); }
    .queue-item.done .q-status { color: var(--success); }
    .queue-item.error { border-color: var(--danger); }
    .queue-item.error .q-status { color: var(--danger); }
    .queue-item.cancelled { opacity: 0.55; }
    .queue-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .queue-item .q-download { font-size: 0.75rem; color: var(--success); }
    select option { font-size: 0.9rem; }
    .advanced {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      padding: 4px 12px 8px;
    }
    .advanced summary {
      cursor: pointer;
      padding: 10px 4px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 550;
    }
    .advanced[open] summary { color: var(--text); }
    .help { font-size: 0.78rem; color: var(--muted); margin: 6px 0 0; }
    .result-toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
    .action-card .btn-row { margin-top: 0; }
    #btn-refresh { padding: 6px 10px; font-size: 0.78rem; border-radius: 999px; }
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>whisburn</h1>
        <p class="tagline">Speech to text on this machine. Add audio, pick a model, download the transcript.</p>
      </div>
      <div class="header-status">
        <span id="status-dot" class="status-dot"></span>
        <span id="server-label">Connecting…</span>
        <button type="button" class="btn-ghost" id="btn-refresh">Refresh models</button>
      </div>
    </header>

    <div class="card">
      <h2><span class="step-num">1</span> Add audio</h2>
      <input type="file" id="file-input" accept="audio/*,.wav,.mp3,.flac,.ogg,.opus,.m4a,.mkv" multiple />
      <div class="tabs">
        <button type="button" class="tab active" id="tab-upload">Upload files</button>
        <button type="button" class="tab" id="tab-record" data-tab="record">Record microphone</button>
      </div>

      <div id="panel-upload">
        <div class="dropzone" id="dropzone">
          <p><strong>Drop audio here</strong> or click to browse</p>
          <p class="hint">WAV, MP3, FLAC, OGG, M4A. Several files run as a batch; each result downloads when it finishes.</p>
        </div>
        <p class="file-name" id="file-name">No file selected yet</p>
        <div class="btn-row" style="margin-top:8px">
          <label class="btn-secondary" for="file-input" style="display:inline-block;text-align:center;cursor:pointer">Browse files…</label>
          <button type="button" class="btn-secondary" id="btn-sample">Try JFK sample</button>
          <button type="button" class="btn-ghost" id="btn-preview" disabled>Listen to a preview</button>
        </div>
      </div>

      <div id="panel-record" class="hidden">
        <div class="record-panel">
          <p class="help">Uses your microphone. Stop when you are done — the clip is queued like an upload.</p>
          <p class="record-timer" id="record-timer">0:00</p>
          <div class="btn-row" style="justify-content:center">
            <button type="button" class="btn-primary" id="btn-record-start" style="flex:none">Start recording</button>
            <button type="button" class="btn-danger hidden" id="btn-record-stop">Stop</button>
          </div>
        </div>
        <p class="file-name" id="record-name"></p>
      </div>

      <audio id="preview" controls class="hidden"></audio>
    </div>

    <div class="card hidden" id="queue-card">
      <h2>Batch queue <span id="queue-count" class="file-name" style="display:inline;margin:0"></span></h2>
      <p class="help" id="batch-hint">Each finished file downloads automatically. You can also save copies into a folder.</p>
      <div class="queue-toolbar">
        <button type="button" class="btn-secondary" id="btn-output-folder">Save to folder…</button>
        <button type="button" class="btn-ghost" id="btn-clear-queue">Clear finished</button>
      </div>
      <p class="file-name" id="output-folder-label">Browser downloads only (no folder selected)</p>
      <ul id="queue-list" class="queue-list"></ul>
    </div>

    <div class="card">
      <h2><span class="step-num">2</span> Choose output</h2>
      <div class="grid-2">
        <div>
          <label for="output-type">I want</label>
          <select id="output-type">
            <option value="transcript" selected>A transcript (speech to text)</option>
            <option value="audio">Converted audio (WAV or Opus)</option>
          </select>
        </div>
        <div>
          <label for="format">File format</label>
          <select id="format">
            <option value="json">JSON</option>
            <option value="txt" selected>Plain text</option>
            <option value="srt">SRT subtitles</option>
            <option value="vtt">WebVTT</option>
          </select>
        </div>
      </div>
      <div id="model-wrap" style="margin-top:14px">
        <label for="model">Model</label>
        <select id="model"><option value="">Loading models…</option></select>
        <p class="help">Smaller models are faster. Larger models are usually more accurate.</p>
        <div id="model-meta"></div>
        <p class="file-name" id="model-desc"></p>
      </div>
      <details class="advanced">
        <summary>More options</summary>
        <div class="grid-2" id="language-row" style="margin-top:8px">
          <div id="language-wrap">
            <label for="language">Language</label>
            <input type="text" id="language" value="en" placeholder="en, or auto for Qwen3" />
          </div>
          <div id="timestamps-wrap">
            <label for="timestamps">Timestamps in the file</label>
            <select id="timestamps">
              <option value="true" selected>On</option>
              <option value="false">Off</option>
            </select>
          </div>
        </div>
        <div class="grid-2" id="transcript-options-row" style="margin-top:14px">
          <div id="diarize-wrap">
            <label for="diarize">Label speakers</label>
            <select id="diarize">
              <option value="false" selected>Off</option>
              <option value="true">On</option>
            </select>
          </div>
          <div id="sentences-wrap">
            <label for="sentences">Merge into sentences</label>
            <select id="sentences">
              <option value="false" selected>Off</option>
              <option value="true">On</option>
            </select>
          </div>
          <div id="file-ext-wrap">
            <label for="file-extension">Save as</label>
            <select id="file-extension">
              <option value="" selected>Match format (.txt, .srt, …)</option>
              <option value="txt">Always .txt</option>
              <option value="srt">Always .srt</option>
              <option value="vtt">Always .vtt</option>
              <option value="json">Always .json</option>
            </select>
          </div>
        </div>
        <div id="bitrate-wrap" class="hidden" style="margin-top:14px">
          <label for="bitrate">Opus bitrate</label>
          <select id="bitrate">
            <option value="medium" selected>Medium (64 kbps)</option>
            <option value="low">Low (32 kbps)</option>
          </select>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-secondary" id="btn-prepare">Preload model</button>
        </div>
        <p class="help">Preload downloads weights now so the first run is faster. Optional — processing also loads the model.</p>
      </details>
    </div>

    <div class="card action-card">
      <h2><span class="step-num">3</span> Run</h2>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btn-transcribe" disabled>Process &amp; download</button>
        <button type="button" class="btn-danger hidden" id="btn-cancel">Cancel</button>
        <button type="button" class="btn-secondary" id="btn-download" disabled>Download again</button>
      </div>
      <p class="status-line" id="status"></p>
      <div id="progress-wrap" class="progress-wrap hidden">
        <div class="progress-block">
          <p class="progress-label">Current file</p>
          <div class="progress-bar"><div id="progress-task" class="progress-fill"></div></div>
          <p id="progress-task-text" class="progress-text">—</p>
        </div>
        <div class="progress-block">
          <p class="progress-label">Overall</p>
          <div class="progress-bar overall"><div id="progress-overall" class="progress-fill overall"></div></div>
          <p id="progress-overall-text" class="progress-text">0%</p>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Transcript</h2>
      <div class="result-toolbar">
        <button type="button" class="btn-ghost" id="btn-copy" disabled>Copy</button>
      </div>
      <textarea id="result" readonly placeholder="The transcript will appear here after you run step 3."></textarea>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusDot = $("status-dot");
    const statusLine = $("status");
    const modelSelect = $("model");
    const outputTypeSelect = $("output-type");
    const formatSelect = $("format");
    const bitrateSelect = $("bitrate");
    const timestampsSelect = $("timestamps");
    const languageInput = $("language");
    const dropzone = $("dropzone");
    const fileInput = $("file-input");
    const fileNameEl = $("file-name");
    const preview = $("preview");
    const btnPrepare = $("btn-prepare");
    const btnTranscribe = $("btn-transcribe");
    const btnDownload = $("btn-download");
    const resultEl = $("result");
    const modelDescEl = $("model-desc");
    const modelMetaEl = $("model-meta");
    const diarizeSelect = $("diarize");
    const sentencesSelect = $("sentences");
    const fileExtSelect = $("file-extension");
    const btnCancel = $("btn-cancel");
    const queueListEl = $("queue-list");
    const queueCard = $("queue-card");

    let audioFile = null;
    let lastResultBlob = null;
    let lastDownloadName = "transcript.txt";
    let defaultModel = "tiny_en";
    let maxAudioSeconds = 24 * 60 * 60;
    let catalog = [];
    let preferredModel = null;
    let gpuInfo = null;
    let fileQueue = [];
    let queueRunning = false;
    let cancelRequested = false;
    let activeXhr = null;
    let outputDirHandle = null;
    let suppressAutoDownload = false;

    const TRANSCRIPT_FORMATS = [
      ["json", "JSON"],
      ["txt", "Plain text"],
      ["srt", "SRT subtitles"],
      ["vtt", "WebVTT"],
    ];
    const AUDIO_FORMATS = [
      ["wav", "WAV (16-bit PCM)"],
      ["opus", "Opus in Ogg"],
    ];

    function syncOutputControls() {
      const audio = outputTypeSelect.value === "audio";
      $("bitrate-wrap").classList.toggle("hidden", !audio || formatSelect.value !== "opus");
      $("language-wrap").classList.toggle("hidden", audio);
      $("timestamps-wrap").classList.toggle("hidden", audio);
      $("language-row").classList.toggle("hidden", audio);
      $("transcript-options-row").classList.toggle("hidden", audio);
      $("model-wrap").classList.toggle("hidden", audio);
      btnPrepare.classList.toggle("hidden", audio);

      formatSelect.innerHTML = "";
      const options = audio ? AUDIO_FORMATS : TRANSCRIPT_FORMATS;
      for (const [value, label] of options) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        formatSelect.appendChild(opt);
      }
      if (!audio) formatSelect.value = "txt";

      updateProcessButton();
      resultEl.placeholder = audio
        ? "Audio file downloads directly; metadata appears here…"
        : "Transcript appears here after processing…";
    }

    // --- Recording (WAV via Web Audio) ---
    let audioContext = null;
    let mediaStream = null;
    let scriptNode = null;
    let recordedChunks = [];
    let recordStart = 0;
    let recordTimerId = null;
    let progressTimer = null;
    let activeTab = "upload";
    let previewInFlight = false;
    let processInFlight = false;

    function tierArrow(metric, tier) {
      const lowGood = metric === "size" || metric === "effort";
      const highGood = metric === "quality" || metric === "efficiency";
      const t = (tier || "medium").toLowerCase();
      if (t === "low") {
        const good = lowGood;
        return `<span class="${good ? "tier-good" : "tier-bad"}">${good ? "↓" : "↑"}</span>`;
      }
      if (t === "high") {
        const good = highGood;
        return `<span class="${good ? "tier-good" : "tier-bad"}">${good ? "↑" : "↓"}</span>`;
      }
      return `<span class="tier-mid">—</span>`;
    }

    function vramSymbol(fit) {
      if (fit === "ok") return `<span class="vram-ok" title="Fits GPU VRAM">✓</span>`;
      if (fit === "tight") return `<span class="vram-tight" title="Tight fit — may OOM">⚠</span>`;
      if (fit === "no") return `<span class="vram-no" title="Exceeds GPU VRAM">✗</span>`;
      return `<span class="vram-tight" title="VRAM unknown">?</span>`;
    }

    function modelOptionLabel(m) {
      const tag = (m.tiers?.tagline || m.description || "").slice(0, 42);
      return tag ? `${m.name} — ${tag}` : m.name;
    }

    function renderModelMeta() {
      const name = modelSelect.value || defaultModel;
      const info = catalog.find((m) => m.name === name);
      if (!info || !info.tiers) {
        modelMetaEl.innerHTML = "";
        return;
      }
      const t = info.tiers;
      const gpuLabel = gpuInfo?.vram_mb
        ? `${gpuInfo.name} · ${gpuInfo.vram_mb} MB VRAM`
        : (gpuInfo?.name || "GPU VRAM unknown");
      modelMetaEl.innerHTML = `
        <div class="meta-row">${vramSymbol(info.vram_fit)} <span>${gpuLabel}</span> · needs ${info.vram_mb} MB</div>
        <div class="meta-row">
          <span class="meta-pill">Size ${tierArrow("size", t.size)} ${t.size}</span>
          <span class="meta-pill">Quality ${tierArrow("quality", t.quality)} ${t.quality}</span>
          <span class="meta-pill">Effort ${tierArrow("effort", t.effort)} ${t.effort}</span>
          <span class="meta-pill">GPU use ${tierArrow("efficiency", t.efficiency)} ${t.efficiency} (${t.efficiency_pct}%)</span>
        </div>
        <div class="file-name">${info.tiers.tagline}</div>`;
    }

    function pendingCount() {
      return fileQueue.filter((q) => q.status === "pending").length;
    }

    function updateProcessButton() {
      const audio = outputTypeSelect.value === "audio";
      const n = pendingCount() || (audioFile ? 1 : 0);
      if (n > 1) {
        btnTranscribe.textContent = audio
          ? `Convert ${n} files`
          : `Transcribe ${n} files`;
      } else {
        btnTranscribe.textContent = audio ? "Convert & download" : "Transcribe & download";
      }
    }

    function renderQueue() {
      const pending = pendingCount();
      const total = fileQueue.length;
      const done = fileQueue.filter((q) => q.status === "done").length;
      $("queue-count").textContent = total ? `(${pending} pending · ${done} done · ${total} total)` : "";
      queueCard.classList.toggle("hidden", total === 0);
      queueListEl.innerHTML = "";
      for (const item of fileQueue) {
        const li = document.createElement("li");
        li.className = `queue-item ${item.status}`;
        const labels = {
          pending: "Waiting",
          processing: "Working",
          done: "Done",
          error: "Failed",
          cancelled: "Cancelled",
        };
        const dl = item.downloadName
          ? `<span class="q-download">${item.savedToFolder ? "saved" : "downloaded"} ${item.downloadName}</span>`
          : "";
        li.innerHTML = `<span class="q-name">${item.file.name} (${formatBytes(item.file.size)})</span>${dl}<span class="q-status">${labels[item.status] || item.status}</span>`;
        queueListEl.appendChild(li);
      }
      btnCancel.classList.toggle("hidden", !processInFlight);
      updateProcessButton();
    }

    function enqueueFiles(files) {
      const list = [...files].filter((f) => f && f.size > 0);
      if (!list.length) return;
      for (const file of list) {
        fileQueue.push({ id: crypto.randomUUID(), file, status: "pending", downloadName: null, savedToFolder: false });
      }
      setAudioFile(list[list.length - 1]);
      renderQueue();
      btnTranscribe.disabled = processInFlight || pendingCount() === 0;
      setStatus(
        list.length > 1
          ? `${list.length} files ready. Click Transcribe to process them one by one.`
          : `${list[0].name} is ready. Click Transcribe to start.`,
        "ok"
      );
    }

    function cancelProcessing() {
      cancelRequested = true;
      activeXhr?.abort();
      for (const item of fileQueue) {
        if (item.status === "pending" || item.status === "processing") {
          item.status = "cancelled";
        }
      }
      setStatus("Cancelled — server may still finish the current job in background", "err");
    }

    function setStatus(msg, kind = "") {
      statusLine.textContent = msg;
      statusDot.className = "status-dot" + (kind ? " " + kind : "");
    }

    function formatBytes(n) {
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(2)} MB`;
    }

    function friendlyError(err, phase, url) {
      const msg = (err && err.message) ? err.message : String(err);
      const target = url || `${location.origin}/v1/…`;
      if (
        msg === "Failed to fetch" ||
        msg.includes("NetworkError") ||
        msg.includes("CONNECTION_ABORTED") ||
        msg.includes("connection aborted")
      ) {
        return `Connection to ${target} was interrupted during ${phase}. The server may have crashed, restarted, or rejected a concurrent request — check the terminal running \`whisburn serve\` and try again.`;
      }
      if (msg.includes("timed out")) {
        return `${phase} timed out (${target}) — long recordings can take 30+ minutes; keep this tab open and the server running.`;
      }
      return `${phase} failed: ${msg}`;
    }

    function autoResizeResult() {
      resultEl.style.height = "auto";
      const next = Math.max(160, resultEl.scrollHeight + 4);
      resultEl.style.height = `${next}px`;
      const copyBtn = $("btn-copy");
      if (copyBtn) copyBtn.disabled = !resultEl.value;
    }

    function showProgress(visible) {
      $("progress-wrap").classList.toggle("hidden", !visible);
      if (!visible) {
        clearInterval(progressTimer);
        setDualProgress(0, "—", 0, "0%");
      }
    }

    function setDualProgress(taskPct, taskText, overallPct, overallText) {
      $("progress-task").style.width = `${Math.min(100, Math.max(0, taskPct))}%`;
      $("progress-overall").style.width = `${Math.min(100, Math.max(0, overallPct))}%`;
      $("progress-task-text").textContent = taskText;
      $("progress-overall-text").textContent = overallText;
    }

    function setProgress(pct, text) {
      setDualProgress(pct, text, pct, `${pct.toFixed(0)}%`);
    }

    function chosenFileExtension(format) {
      const override = fileExtSelect.value.trim();
      if (override) return override;
      if (format === "opus") return "ogg";
      return format;
    }

    function buildDownloadName(stem, format) {
      const ext = chosenFileExtension(format);
      const safe = (stem || "whisburn").replace(/[^a-zA-Z0-9_-]+/g, "_");
      const batch = pendingCount() + fileQueue.filter((q) => q.status === "processing" || q.status === "done").length > 1;
      if (batch && outputTypeSelect.value !== "audio") {
        const model = (modelSelect.value || defaultModel).replace(/[^a-zA-Z0-9_.-]+/g, "_");
        return `${safe || "whisburn"}__${model}.${ext}`;
      }
      return `${safe || "whisburn"}.${ext}`;
    }

    function parseSseChunk(chunk, onEvent) {
      for (const line of chunk.split("\n")) {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) continue;
        try {
          onEvent(JSON.parse(trimmed.slice(5).trim()));
        } catch (_) { /* partial json */ }
      }
    }

    function transcribeStream(url, formData, handlers) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        activeXhr = xhr;
        xhr.open("POST", url);
        let sseOffset = 0;
        const uploadStart = Date.now();

        xhr.upload.onprogress = (e) => {
          if (!handlers.onUploadProgress) return;
          const elapsed = Math.max(0.001, (Date.now() - uploadStart) / 1000);
          const speed = e.loaded / elapsed / 1024;
          handlers.onUploadProgress(e.loaded, e.lengthComputable ? e.total : 0, speed);
        };
        xhr.upload.onloadend = () => {
          if (handlers.onUploadComplete) handlers.onUploadComplete();
        };
        xhr.onprogress = () => {
          const chunk = xhr.responseText.slice(sseOffset);
          sseOffset = xhr.responseText.length;
          parseSseChunk(chunk, handlers.onProgress);
        };
        xhr.onload = () => {
          activeXhr = null;
          if (cancelRequested) {
            reject(new Error("Cancelled"));
            return;
          }
          const tail = xhr.responseText.slice(sseOffset);
          parseSseChunk(tail, handlers.onProgress);
          if (xhr.status >= 200 && xhr.status < 300) resolve(xhr);
          else reject(new Error(`HTTP ${xhr.status}`));
        };
        xhr.onerror = () => { activeXhr = null; reject(new Error(cancelRequested ? "Cancelled" : "Failed to fetch")); };
        xhr.onabort = () => { activeXhr = null; reject(new Error("Cancelled")); };
        xhr.ontimeout = () => { activeXhr = null; reject(new Error("Request timed out")); };
        xhr.send(formData);
      });
    }

    function setBusy(busy) {
      const serverLabel = $("server-label");
      if (serverLabel && !busy && statusDot.classList.contains("ok")) {
        serverLabel.textContent = "Ready";
      } else if (serverLabel && busy) {
        serverLabel.textContent = "Working";
      }
      btnPrepare.disabled = busy;
      const hasWork = fileQueue.some((q) => q.status === "pending") || audioFile;
      btnTranscribe.disabled = busy || !hasWork;
      $("btn-sample").disabled = busy;
      $("btn-preview").disabled = busy || !audioFile;
      $("btn-refresh").disabled = busy;
      btnCancel.classList.toggle("hidden", !busy);
    }

    async function ensureServer(phase) {
      try {
        const r = await fetch("/health", { cache: "no-store" });
        if (!r.ok) throw new Error("health check failed");
        return true;
      } catch (e) {
        setStatus(friendlyError(e, phase, `${location.origin}/health`), "err");
        return false;
      }
    }

    function xhrRequest(url, formData, options = {}) {
      const {
        onUploadProgress,
        onUploadComplete,
        responseType = "blob",
        timeoutMs = 0,
      } = options;
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        activeXhr = xhr;
        xhr.open("POST", url);
        xhr.responseType = responseType;
        if (timeoutMs > 0) xhr.timeout = timeoutMs;
        const uploadStart = Date.now();
        if (formData) {
          xhr.upload.onprogress = (e) => {
            if (!onUploadProgress) return;
            const elapsed = Math.max(0.001, (Date.now() - uploadStart) / 1000);
            const speed = e.loaded / elapsed / 1024;
            onUploadProgress(e.loaded, e.lengthComputable ? e.total : 0, speed);
          };
          xhr.upload.onloadend = () => {
            if (onUploadComplete) onUploadComplete();
          };
        }
        xhr.onload = () => {
          activeXhr = null;
          if (cancelRequested) {
            reject(new Error("Cancelled"));
            return;
          }
          const cd = xhr.getResponseHeader("Content-Disposition") || "";
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve({
              body: xhr.response,
              status: xhr.status,
              contentDisposition: cd,
              contentType: xhr.getResponseHeader("Content-Type") || "",
            });
            return;
          }
          if (responseType === "blob" && xhr.response instanceof Blob) {
            xhr.response.text().then((t) => {
              try {
                const j = JSON.parse(t);
                reject(new Error(j.error || `HTTP ${xhr.status}`));
              } catch {
                reject(new Error(`HTTP ${xhr.status}`));
              }
            }).catch(() => reject(new Error(`HTTP ${xhr.status}`)));
            return;
          }
          reject(new Error(`HTTP ${xhr.status}`));
        };
        xhr.onerror = () => { activeXhr = null; reject(new Error(cancelRequested ? "Cancelled" : "Failed to fetch")); };
        xhr.onabort = () => { activeXhr = null; reject(new Error("Cancelled")); };
        xhr.ontimeout = () => { activeXhr = null; reject(new Error("Request timed out")); };
        xhr.send(formData);
      });
    }

    function startProcessingTimer(label, overallPct) {
      const start = Date.now();
      const base = overallPct ?? 55;
      progressTimer = setInterval(() => {
        const elapsed = formatTimer(Date.now() - start);
        setDualProgress(
          100,
          `${label} (${elapsed}) — waiting on server…`,
          base,
          `${base.toFixed(0)}%`
        );
      }, 500);
    }

    function setAudioFile(file) {
      audioFile = file;
      const label = file ? `${file.name} (${formatBytes(file.size)})` : "No file selected";
      fileNameEl.textContent = label;
      $("record-name").textContent = file && file.name.startsWith("recording") ? label : "";
      btnTranscribe.disabled = !file || processInFlight;
      $("btn-preview").disabled = !file || processInFlight || previewInFlight;
      showUploadPanel();
      if (file) {
        setStatus(`${file.name} is ready. Click Transcribe & download when you want to start.`, "ok");
      } else {
        preview.classList.add("hidden");
        preview.removeAttribute("src");
      }
    }

    function showUploadPanel() {
      activeTab = "upload";
      $("tab-upload").classList.add("active");
      $("tab-record").classList.remove("active");
      $("panel-upload").classList.remove("hidden");
      $("panel-record").classList.add("hidden");
    }

    function showRecordPanel() {
      activeTab = "record";
      $("tab-upload").classList.remove("active");
      $("tab-record").classList.add("active");
      $("panel-upload").classList.add("hidden");
      $("panel-record").classList.remove("hidden");
    }

    async function loadCatalog(preserveModel) {
      const keep = preserveModel || preferredModel || modelSelect.value || defaultModel;
      setStatus("Connecting to server…");
      try {
        await fetch("/health").then((r) => { if (!r.ok) throw new Error("health check failed"); });
        const [models, config] = await Promise.all([
          fetch("/v1/models").then((r) => r.json()),
          fetch("/v1/config").then((r) => r.ok ? r.json() : null).catch(() => null),
        ]);
        if (config?.default_model) defaultModel = config.default_model;
        if (config?.max_audio_seconds) maxAudioSeconds = config.max_audio_seconds;
        if (config?.gpu) gpuInfo = config.gpu;
        catalog = models;
        const ready = models.filter((m) => m.burn_ready && m.category === "Asr");
        modelSelect.innerHTML = "";
        if (ready.length === 0) {
          const opt = document.createElement("option");
          opt.value = defaultModel;
          opt.textContent = defaultModel;
          modelSelect.appendChild(opt);
        } else {
          for (const m of ready) {
            const opt = document.createElement("option");
            opt.value = m.name;
            const loaded = m.loaded ? " [loaded]" : "";
            opt.textContent = `${modelOptionLabel(m)}${loaded}`;
            modelSelect.appendChild(opt);
          }
        }
        if (keep && [...modelSelect.options].some((o) => o.value === keep)) {
          modelSelect.value = keep;
          preferredModel = keep;
        } else if (ready.some((m) => m.name === defaultModel)) {
          modelSelect.value = defaultModel;
          preferredModel = defaultModel;
        }
        updateModelDesc();
        const loadedCount = models.filter((m) => m.loaded).length;
        const maxHrs = Math.round(maxAudioSeconds / 3600);
        const gpuLine = gpuInfo?.vram_mb
          ? `${gpuInfo.name} (${gpuInfo.vram_mb} MB VRAM)`
          : (gpuInfo?.name || "GPU VRAM unknown");
        const serverLabel = $("server-label");
        if (serverLabel) serverLabel.textContent = "Ready";
        setStatus(`Ready. ${loadedCount} model(s) in GPU memory. ${gpuLine}. Recordings up to ${maxHrs}h.`, "ok");
      } catch (e) {
        const serverLabel = $("server-label");
        if (serverLabel) serverLabel.textContent = "Offline";
        setStatus(`Server error: ${e.message}`, "err");
      }
    }

    async function loadPreview() {
      if (!audioFile) return;
      if (processInFlight) {
        setStatus("Wait for transcription to finish before previewing.", "err");
        return;
      }
      if (!(await ensureServer("audio preview"))) return;
      const url = "/v1/transcode/stream?format=opus&bitrate=medium";
      const form = new FormData();
      form.append("audio", audioFile, audioFile.name);
      previewInFlight = true;
      setBusy(true);
      setStatus(`Generating preview for ${audioFile.name}…`, "busy");
      try {
        const resp = await xhrRequest(url, form, {
          onUploadProgress: (loaded, total, speed) => {
            showProgress(true);
            if (total > 0) {
              const uploadPct = (loaded / total) * 100;
              setDualProgress(
                uploadPct,
                `Preview upload ${uploadPct.toFixed(0)}% · ${speed.toFixed(0)} KB/s`,
                uploadPct * 0.5,
                `${(uploadPct * 0.5).toFixed(0)}%`
              );
            } else {
              setDualProgress(
                50,
                `Preview upload ${formatBytes(loaded)} · ${speed.toFixed(0)} KB/s`,
                25,
                "25%"
              );
            }
          },
        });
        showProgress(false);
        preview.src = URL.createObjectURL(resp.body);
        preview.classList.remove("hidden");
        setStatus(`Preview ready — ${audioFile.name}`, "ok");
      } catch (e) {
        showProgress(false);
        preview.classList.add("hidden");
        setStatus(friendlyError(e, "audio preview", `${location.origin}${url}`), "err");
      } finally {
        previewInFlight = false;
        setBusy(processInFlight);
        $("btn-preview").disabled = !audioFile || processInFlight;
      }
    }

    function parseFilename(resp, fallback) {
      const cd = resp.headers.get("Content-Disposition") || "";
      const match = cd.match(/filename="([^"]+)"/);
      return match ? match[1] : fallback;
    }

    function triggerDownload(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 2500);
    }

    async function writeToOutputFolder(blob, name) {
      if (!outputDirHandle) return false;
      const handle = await outputDirHandle.getFileHandle(name, { create: true });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    }

    async function deliverOutput(blob, name) {
      lastResultBlob = blob;
      lastDownloadName = name;
      btnDownload.disabled = false;
      let savedToFolder = false;
      if (!suppressAutoDownload) {
        triggerDownload(blob, name);
        try {
          savedToFolder = await writeToOutputFolder(blob, name);
        } catch (e) {
          setStatus(`Saved download ${name}, but folder write failed: ${e.message}`, "err");
        }
      }
      return savedToFolder;
    }

    async function chooseOutputFolder() {
      if (!window.showDirectoryPicker) {
        setStatus("This browser cannot pick a folder — files will still download as they finish.", "err");
        return;
      }
      try {
        outputDirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        $("output-folder-label").textContent = `Also writing into folder: ${outputDirHandle.name}`;
        setStatus(`Batch outputs will be written to “${outputDirHandle.name}” as each file finishes.`, "ok");
      } catch (e) {
        if (e && e.name === "AbortError") return;
        setStatus(`Folder picker failed: ${e.message}`, "err");
      }
    }

    function updateModelDesc() {
      const name = modelSelect.value || defaultModel;
      const info = catalog.find((m) => m.name === name);
      if (!info) {
        modelDescEl.textContent = "";
        modelMetaEl.innerHTML = "";
        return;
      }
      const mem = info.loaded ? "in GPU memory" : "loads on first use";
      modelDescEl.textContent = `${info.description} (${mem})`;
      renderModelMeta();
    }

    async function prepareModel() {
      const model = modelSelect.value || preferredModel || defaultModel;
      preferredModel = model;
      if (!(await ensureServer("preload model"))) return;
      setBusy(true);
      showProgress(true);
      setDualProgress(0, "Connecting to server…", 0, "0%");
      setStatus(`Preloading ${model} — downloading weights and loading GPU if needed`, "busy");

      const phases = [
        [10, "Checking model cache…"],
        [35, "Downloading model weights…"],
        [65, "Converting for inference…"],
        [85, "Loading into GPU memory…"],
      ];
      let phaseIdx = 0;
      progressTimer = setInterval(() => {
        if (phaseIdx < phases.length) {
          const [overall, label] = phases[phaseIdx];
          setDualProgress(phaseIdx * 25, label, overall, `${overall}%`);
          phaseIdx += 1;
        }
      }, 4000);

      try {
        const resp = await xhrRequest(
          `/v1/models/${encodeURIComponent(model)}/ensure`,
          null,
          { responseType: "json" }
        );
        clearInterval(progressTimer);
        const data = resp.body;
        setDualProgress(100, `Model ${model} ready`, 100, "100%");
        setStatus(`Model ready at ${data.path}`, "ok");
        await loadCatalog(model);
      } catch (e) {
        const url = `/v1/models/${encodeURIComponent(model)}/ensure`;
        setStatus(friendlyError(e, "preload model", `${location.origin}${url}`), "err");
      } finally {
        clearInterval(progressTimer);
        showProgress(false);
        setBusy(false);
        btnTranscribe.disabled = !audioFile;
      }
    }

    async function loadSample() {
      setStatus("Loading JFK sample…", "busy");
      try {
        const resp = await fetch("/samples/jfk.wav");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const blob = await resp.blob();
        enqueueFiles([new File([blob], "jfk.wav", { type: "audio/wav" })]);
        setStatus("Sample loaded — ready to process.", "ok");
      } catch (e) {
        setStatus(`Sample load failed: ${e.message}`, "err");
      }
    }

    function mimeForFormat(format) {
      if (format === "json") return "application/json";
      if (format === "vtt") return "text/vtt";
      return "text/plain";
    }

    function formatEta(secs) {
      if (secs == null || !isFinite(secs) || secs <= 0) return null;
      if (secs < 60) return `${Math.round(secs)}s`;
      const m = Math.floor(secs / 60);
      const s = Math.round(secs % 60);
      return `${m}m ${s}s`;
    }

    function handleStreamProgress(ev, stem, format) {
      if (ev.phase === "error") {
        throw new Error(ev.task_label || "Transcription failed");
      }
      const chunkHint = ev.chunk != null && ev.chunks_total
        ? ` · segment ${ev.chunk}/${ev.chunks_total}`
        : "";
      let taskText = `${ev.task_label}${chunkHint} — ${ev.task_pct.toFixed(0)}%`;

      const elapsed = ev.elapsed_secs != null ? ev.elapsed_secs : null;
      const eta = ev.eta_secs != null ? ev.eta_secs : null;

      if (elapsed != null) {
        const elStr = elapsed < 60 ? `${elapsed.toFixed(0)}s` : `${Math.floor(elapsed/60)}m${Math.round(elapsed%60)}s`;
        const etaStr = formatEta(eta);
        const timeInfo = etaStr ? ` · ${elStr} elapsed, ~${etaStr} left` : ` · ${elStr} elapsed`;
        taskText += timeInfo;
      }

      const overallText = `${ev.overall_pct.toFixed(0)}%`;
      setDualProgress(ev.task_pct, taskText, ev.overall_pct, overallText);
      setStatus(ev.task_label, "busy");

      if (ev.partial_text) {
        resultEl.value = ev.partial_text;
        autoResizeResult();
        resultEl.scrollTop = resultEl.scrollHeight;
      }

      if (ev.phase === "done" && ev.partial_text) {
        lastDownloadName = buildDownloadName(stem, format);
        lastResultBlob = new Blob([ev.partial_text], { type: mimeForFormat(format) });
        const doneLabel = ev.elapsed_secs != null
          ? `Complete in ${formatEta(ev.elapsed_secs) || ev.elapsed_secs.toFixed(0) + 's'}`
          : "Complete";
        setDualProgress(100, doneLabel, 100, "100%");
      }
    }

    async function processOneFile(file) {
      const isAudio = outputTypeSelect.value === "audio";
      const format = formatSelect.value;
      const form = new FormData();
      form.append("audio", file, file.name);
      const stem = file.name.replace(/\.[^.]+$/, "") || "whisburn";

      setAudioFile(file);
      lastResultBlob = null;
      lastDownloadName = buildDownloadName(stem, format === "opus" ? "ogg" : format);
      showProgress(true);
      setDualProgress(0, `Uploading ${file.name}…`, 0, "0%");
      setStatus(`Uploading ${formatBytes(file.size)}…`, "busy");
      resultEl.value = "";
      autoResizeResult();

      let url;
      let processLabel;
      if (isAudio) {
        const params = new URLSearchParams({ format, download: "true" });
        if (format === "opus") params.set("bitrate", bitrateSelect.value);
        url = `/v1/transcode?${params}`;
        processLabel = `Transcoding to ${format}`;
      } else {
        const model = modelSelect.value || preferredModel || defaultModel;
        preferredModel = model;
        const language = languageInput.value.trim() || "en";
        const params = new URLSearchParams({
          model,
          format,
          language,
          timestamps: timestampsSelect.value,
          sentences: sentencesSelect ? sentencesSelect.value : "false",
        });
        if (diarizeSelect.value === "true") params.set("task", "diarize");
        const extOverride = fileExtSelect.value.trim();
        if (extOverride) params.set("file_extension", extOverride);
        url = `/v1/transcribe/stream?${params}`;
        processLabel = diarizeSelect.value === "true"
          ? `Transcribing with speaker labels (${model})`
          : `Transcribing with ${model}`;
      }

      if (isAudio) {
        const resp = await xhrRequest(url, form, {
          onUploadProgress: (loaded, total, speed) => {
            if (total > 0) {
              const uploadPct = (loaded / total) * 100;
              const overallPct = uploadPct * 0.15;
              setDualProgress(
                uploadPct,
                `Upload ${uploadPct.toFixed(0)}% · ${speed.toFixed(0)} KB/s`,
                overallPct,
                `${overallPct.toFixed(0)}%`
              );
            } else {
              setDualProgress(50, `Uploading ${formatBytes(loaded)} · ${speed.toFixed(0)} KB/s`, 8, "8%");
            }
          },
          onUploadComplete: () => {
            setDualProgress(100, `${processLabel}…`, 20, "20%");
            const longHint = file.size > 10 * 1024 * 1024
              ? " — long files may take a while; do not close this tab"
              : "";
            setStatus(`${processLabel}…${longHint}`, "busy");
            startProcessingTimer(processLabel, 20);
          },
        });
        clearInterval(progressTimer);
        const blob = resp.body;
        lastResultBlob = blob;
        lastDownloadName = parseFilename(
          { headers: { get: () => resp.contentDisposition } },
          buildDownloadName(stem, format === "opus" ? "ogg" : "wav")
        );
        resultEl.value = `Downloaded ${lastDownloadName} (${formatBytes(blob.size)})`;
        autoResizeResult();
        setDualProgress(100, "Complete", 100, "100%");
        const savedToFolder = await deliverOutput(blob, lastDownloadName);
        setStatus(`Done — ${file.name} downloaded.`, "ok");
        return { blob, name: lastDownloadName, savedToFolder };
      }

      let streamError = null;
      await transcribeStream(url, form, {
        onUploadProgress: (loaded, total, speed) => {
          if (total > 0) {
            const uploadPct = (loaded / total) * 100;
            const overallPct = uploadPct * 0.08;
            setDualProgress(
              uploadPct,
              `Upload ${uploadPct.toFixed(0)}% · ${speed.toFixed(0)} KB/s · ${formatBytes(loaded)} / ${formatBytes(total)}`,
              overallPct,
              `${overallPct.toFixed(0)}%`
            );
          } else {
            setDualProgress(50, `Uploading ${formatBytes(loaded)} · ${speed.toFixed(0)} KB/s`, 4, "4%");
          }
        },
        onUploadComplete: () => {
          setDualProgress(0, "Analyzing audio on server…", 8, "8%");
          const longHint = file.size > 10 * 1024 * 1024
            ? " — long files may take a while; do not close this tab"
            : "";
          setStatus(`${processLabel}…${longHint}`, "busy");
        },
        onProgress: (ev) => {
          try {
            handleStreamProgress(ev, stem, format);
          } catch (e) {
            streamError = e;
          }
        },
      });
      if (streamError) throw streamError;
      if (!lastResultBlob) {
        throw new Error("Transcription finished without a downloadable result");
      }
      const savedToFolder = await deliverOutput(lastResultBlob, lastDownloadName);
      setStatus(`Done — ${lastDownloadName} downloaded.`, "ok");
      return { blob: lastResultBlob, name: lastDownloadName, savedToFolder };
    }

    async function runQueue() {
      if (queueRunning) return;
      queueRunning = true;
      cancelRequested = false;
      processInFlight = true;
      setBusy(true);

      try {
        while (!cancelRequested) {
          const item = fileQueue.find((q) => q.status === "pending");
          if (!item) break;
          item.status = "processing";
          renderQueue();
          try {
            const out = await processOneFile(item.file);
            if (cancelRequested) {
              item.status = "cancelled";
            } else {
              item.status = "done";
              if (out) {
                item.downloadName = out.name;
                item.savedToFolder = !!out.savedToFolder;
              }
            }
          } catch (e) {
            if (cancelRequested || e.message === "Cancelled") {
              item.status = "cancelled";
            } else {
              item.status = "error";
              setStatus(friendlyError(e, "processing", location.origin), "err");
            }
          }
          renderQueue();
        }
        const done = fileQueue.filter((q) => q.status === "done").length;
        const total = fileQueue.length;
        if (!cancelRequested && done === total && total > 0) {
          setStatus(`Batch complete — ${done} file(s) processed, downloads started as each finished.`, "ok");
          await loadCatalog(preferredModel || modelSelect.value || defaultModel);
        }
      } finally {
        clearInterval(progressTimer);
        queueRunning = false;
        processInFlight = false;
        showProgress(false);
        setBusy(false);
        renderQueue();
      }
    }

    async function processAudio() {
      if (previewInFlight) {
        setStatus("Wait for preview to finish before processing.", "err");
        return;
      }
      if (!(await ensureServer("processing"))) return;

      if (fileQueue.length === 0 && audioFile) {
        fileQueue.push({ id: crypto.randomUUID(), file: audioFile, status: "pending", downloadName: null, savedToFolder: false });
        renderQueue();
      }
      if (!fileQueue.some((q) => q.status === "pending")) {
        setStatus("No files queued — drop or browse audio first.", "err");
        return;
      }
      await runQueue();
    }

    // --- Upload tab ---
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const files = e.dataTransfer?.files;
      if (files?.length) enqueueFiles(files);
    });
    fileInput.addEventListener("change", () => {
      const files = fileInput.files;
      if (files?.length) enqueueFiles(files);
      fileInput.value = "";
    });

    $("tab-record").addEventListener("click", showRecordPanel);
    $("tab-upload").addEventListener("click", showUploadPanel);
    $("btn-preview").addEventListener("click", loadPreview);

    // --- WAV encoder for microphone ---
    function encodeWav(samples, sampleRate) {
      const numSamples = samples.length;
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, numSamples * 2, true);
      let offset = 44;
      for (let i = 0; i < numSamples; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function mergeChunks(chunks) {
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const out = new Float32Array(total);
      let off = 0;
      for (const c of chunks) { out.set(c, off); off += c.length; }
      return out;
    }

    function formatTimer(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    $("btn-record-start").addEventListener("click", async () => {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(mediaStream);
        scriptNode = audioContext.createScriptProcessor(4096, 1, 1);
        recordedChunks = [];
        scriptNode.onaudioprocess = (e) => {
          recordedChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        };
        source.connect(scriptNode);
        scriptNode.connect(audioContext.destination);
        recordStart = Date.now();
        recordTimerId = setInterval(() => {
          $("record-timer").textContent = formatTimer(Date.now() - recordStart);
        }, 200);
        $("btn-record-start").classList.add("hidden");
        $("btn-record-stop").classList.remove("hidden");
        setStatus("Recording…", "busy");
      } catch (e) {
        setStatus(`Microphone error: ${e.message}`, "err");
      }
    });

    $("btn-record-stop").addEventListener("click", () => {
      clearInterval(recordTimerId);
      scriptNode?.disconnect();
      mediaStream?.getTracks().forEach((t) => t.stop());
      const samples = mergeChunks(recordedChunks);
      const wav = encodeWav(samples, audioContext?.sampleRate || 16000);
      const file = new File([wav], "recording.wav", { type: "audio/wav" });
      enqueueFiles([file]);
      $("btn-record-start").classList.remove("hidden");
      $("btn-record-stop").classList.add("hidden");
      $("record-timer").textContent = "0:00";
      setStatus("Recording saved.", "ok");
    });

    modelSelect.addEventListener("change", () => {
      preferredModel = modelSelect.value;
      updateModelDesc();
    });
    outputTypeSelect.addEventListener("change", syncOutputControls);
    formatSelect.addEventListener("change", () => {
      $("bitrate-wrap").classList.toggle(
        "hidden",
        outputTypeSelect.value !== "audio" || formatSelect.value !== "opus"
      );
    });
    $("btn-refresh").addEventListener("click", loadCatalog);
    $("btn-sample").addEventListener("click", loadSample);
    $("btn-output-folder").addEventListener("click", chooseOutputFolder);
    $("btn-clear-queue").addEventListener("click", () => {
      fileQueue = fileQueue.filter((q) => q.status === "pending" || q.status === "processing");
      if (!fileQueue.length) {
        audioFile = null;
        fileNameEl.textContent = "No file selected";
        btnTranscribe.disabled = true;
      }
      renderQueue();
    });
    btnPrepare.addEventListener("click", prepareModel);
    btnTranscribe.addEventListener("click", processAudio);
    btnCancel.addEventListener("click", cancelProcessing);
    btnDownload.addEventListener("click", () => {
      if (lastResultBlob) triggerDownload(lastResultBlob, lastDownloadName);
    });
    $("btn-copy").addEventListener("click", async () => {
      if (!resultEl.value) return;
      try {
        await navigator.clipboard.writeText(resultEl.value);
        setStatus("Copied transcript to clipboard.", "ok");
      } catch {
        resultEl.select();
        document.execCommand("copy");
        setStatus("Copied transcript to clipboard.", "ok");
      }
    });

    syncOutputControls();
    loadCatalog();

    // Same request builder the UI uses — exposed for frontend matrix tests.
    function transcribeQueryParams() {
      const model = modelSelect.value || preferredModel || defaultModel;
      const format = formatSelect.value;
      const language = languageInput.value.trim() || "en";
      const params = new URLSearchParams({
        model,
        format,
        language,
        timestamps: timestampsSelect.value,
        sentences: sentencesSelect ? sentencesSelect.value : "false",
      });
      if (diarizeSelect.value === "true") params.set("task", "diarize");
      const extOverride = fileExtSelect.value.trim();
      if (extOverride) params.set("file_extension", extOverride);
      return params;
    }

    async function runFrontendMatrix(options = {}) {
      const models = options.models || catalog.filter((m) => m.burn_ready && m.category === "Asr").map((m) => m.name);
      const formats = options.formats || ["json", "txt", "srt", "vtt"];
      const timestamps = options.timestamps || ["true", "false"];
      const diarize = options.diarize || ["false", "true"];
      const sentences = options.sentences || ["false", "true"];
      const languages = options.languages || ["en"];
      const file = options.file || audioFile;
      if (!file) throw new Error("matrix test needs an audio file queued");
      const results = [];
      suppressAutoDownload = options.download !== true;
      outputTypeSelect.value = "transcript";
      syncOutputControls();
      for (const model of models) {
        modelSelect.value = model;
        preferredModel = model;
        updateModelDesc();
        for (const format of formats) {
          formatSelect.value = format;
          for (const ts of timestamps) {
            timestampsSelect.value = ts;
            for (const dia of diarize) {
              diarizeSelect.value = dia;
              for (const sent of sentences) {
                sentencesSelect.value = sent;
                for (const language of languages) {
                  languageInput.value = language;
                  const label = `${model}|${format}|ts=${ts}|dia=${dia}|sent=${sent}|lang=${language}`;
                  const started = Date.now();
                  try {
                    lastResultBlob = null;
                    const out = await processOneFile(file);
                    const text = out && out.blob ? await out.blob.text() : "";
                    results.push({
                      ok: true,
                      label,
                      bytes: text.length,
                      preview: text.slice(0, 160),
                      ms: Date.now() - started,
                    });
                  } catch (e) {
                    results.push({ ok: false, label, error: e.message || String(e), ms: Date.now() - started });
                  }
                }
              }
            }
          }
        }
      }
      suppressAutoDownload = false;
      const failed = results.filter((r) => !r.ok);
      resultEl.value = JSON.stringify({ total: results.length, failed: failed.length, results }, null, 2);
      autoResizeResult();
      setStatus(
        failed.length
          ? `Matrix finished with ${failed.length}/${results.length} failures`
          : `Matrix passed — ${results.length} setting combinations`,
        failed.length ? "err" : "ok"
      );
      return { total: results.length, failed: failed.length, results };
    }
    window.__whisburn = { runFrontendMatrix, transcribeQueryParams, enqueueFiles, processOneFile };
  </script>
</body>
