[package]
name = "whisburn-engine"
description = "Burn-based speech inference engine (Whisper, Parakeet, and more)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
whisburn-core = { workspace = true }
whisburn-audio = { workspace = true }
burn = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
num-traits = "0.2"
hound = { workspace = true }
tokenizers = { workspace = true }
npy = { workspace = true }
cfg-if = "1.0"
strum = { workspace = true }
strum_macros = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dasp = { version = "0.11", features = ["all"] }
rtrb = "0.3"
flate2 = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }
rustls-rustcrypto = { workspace = true }
indicatif = { workspace = true }
regex = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
memmap2 = "0.9.11"
termsize = "0.1"
cpal = "0.18"
clap = { workspace = true }
tracing = { workspace = true }

[features]
default = ["wgpu", "cpu"]
wgpu = ["burn/wgpu"]
# Flex is the pure-Rust CPU backend. Rayon is the host thread pool.
cpu = ["burn/flex"]

[dev-dependencies]
indicatif = { workspace = true }
sysinfo = "0.39"
whisburn-audio = { workspace = true }