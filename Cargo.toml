[workspace]
resolver = "2"
members = [
    "crates/o3whisburn-core",
    "crates/o3whisburn-audio",
    "crates/o3whisburn-engine",
    "crates/o3whisburn-models",
    "crates/o3whisburn-server",
    "crates/o3whisburn-cli",
    "crates/o3whisburn-app",
]
default-members = ["crates/o3whisburn-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lyam/o3whisburn"

[workspace.dependencies]
o3whisburn-core = { path = "crates/o3whisburn-core" }
o3whisburn-audio = { path = "crates/o3whisburn-audio" }
o3whisburn-engine = { path = "crates/o3whisburn-engine" }
o3whisburn-models = { path = "crates/o3whisburn-models" }
o3whisburn-server = { path = "crates/o3whisburn-server" }
o3whisburn-app = { path = "crates/o3whisburn-app" }

burn = { version = "0.16.1", features = ["wgpu", "ndarray", "record-backward-compat", "fusion"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
ureq = "2.12"
hf-hub = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "pcm", "aac", "isomp4", "mkv"] }
rubato = "0.16"
hound = "3.5"
tokenizers = { version = "0.22", default-features = false, features = ["onig", "http"] }
npy = { git = "https://github.com/Lyamc/npy-rs" }
strum = "0.28"
strum_macros = "0.28"
flate2 = "1.0"
indicatif = "0.17"
regex = "1.11"
chrono = "0.4"
uuid = { version = "1.15", features = ["v4", "serde", "js"] }
tempfile = "3.17"
safetensors = "0.4"
half = "2.4"

[profile.release]
opt-level = 1
overflow-checks = false
debug = 1