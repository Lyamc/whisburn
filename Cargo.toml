[workspace]
resolver = "2"
members = [
    "crates/whisburn-core",
    "crates/whisburn-audio",
    "crates/whisburn-engine",
    "crates/whisburn-models",
    "crates/whisburn-server",
    "crates/whisburn-cli",
    "crates/whisburn-app",
]
default-members = ["crates/whisburn-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lyam/whisburn"

[workspace.dependencies]
whisburn-core = { path = "crates/whisburn-core" }
whisburn-audio = { path = "crates/whisburn-audio" }
whisburn-engine = { path = "crates/whisburn-engine" }
whisburn-models = { path = "crates/whisburn-models" }
whisburn-server = { path = "crates/whisburn-server" }
whisburn-app = { path = "crates/whisburn-app" }

# No default features: those pull optim/train. Inference uses WGPU plus Flex.
burn = { version = "0.22.1", default-features = false, features = ["std", "wgpu", "flex", "fusion"] }
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
# Pure-Rust TLS. ureq's `rustls` feature pulls ring (needs `cc`). This provider is
# Lyamc/rustls-rustcrypto: RustCrypto only, no OpenSSL, no ring, no `cc`.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = { git = "https://github.com/Lyamc/rustls-rustcrypto", rev = "9cba6e9c0a3348cfe8386ff93f05445de20a4c2b" }
hf-hub = { path = "third_party/hf-hub", default-features = false, features = ["ureq"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac", "ogg", "pcm", "aac", "isomp4", "mkv"] }
rubato = "5"
hound = "3.5"
# fancy-regex instead of onig (onig_sys needs the `cc` crate / a C toolchain)
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex", "progressbar"] }
npy = { git = "https://github.com/Lyamc/npy-rs" }
strum = "0.28"
strum_macros = "0.28"
flate2 = "1.0"
indicatif = "0.18"
regex = "1.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde", "js"] }
tempfile = "3"
safetensors = "0.8"
half = "2"

[profile.release]
opt-level = 1
overflow-checks = false
debug = 1