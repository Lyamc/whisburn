[package]
name = "hf-hub"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
documentation = "https://docs.rs/hf-hub"
repository = "https://github.com/huggingface/hf-hub"
keywords = ["huggingface", "hf", "hub", "machine-learning"]
description = """
This crates aims ease the interaction with huggingface
It aims to be compatible with the huggingface_hub python package, but only implements a smaller subset of functions.
"""

[dependencies]
futures = { version = "0.3.28", optional = true }
dirs = "6"
http = { version = "1.0.0", optional = true }
indicatif = { version = "0.18", optional = true }
log = "0.4.19"
num_cpus = { version = "1.15.0", optional = true }
rand = { version = "0.9", optional = true }
reqwest = { version = "0.12.2", optional = true, default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1.29.1", optional = true, features = ["fs", "macros"] }
# Patched for whisburn: no ring (`cc`) and no OpenSSL. Crypto provider is
# Lyamc/rustls-rustcrypto, installed before the first HTTPS request.
ureq = { version = "3", optional = true, default-features = false, features = [
  "json",
  "socks-proxy",
  "rustls-no-provider",
  "rustls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-rustcrypto = { git = "https://github.com/Lyamc/rustls-rustcrypto", rev = "9cba6e9c0a3348cfe8386ff93f05445de20a4c2b" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"]
optional = true

[features]
default = ["default-tls", "tokio", "ureq"]
# Kept so older feature sets still select a backend. TLS is rustls-rustcrypto
# on the ureq dependency above, not OS native-tls / OpenSSL.
default-tls = []
# reqwest 0.12 names this `rustls-tls-no-provider` (manual roots, no ring).
# The ureq API used by whisburn does not enable it.
rustls-tls = ["reqwest?/rustls-tls-no-provider"]
tokio = [
  "dep:futures",
  "dep:indicatif",
  "dep:num_cpus",
  "dep:rand",
  "dep:reqwest",
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/macos-system-configuration",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "tokio/rt-multi-thread",
  "dep:windows-sys",
]
ureq = [
  "dep:http",
  "dep:indicatif",
  "dep:rand",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:ureq",
  "dep:windows-sys",
]

[dev-dependencies]
hex-literal = "1.0"
sha2 = "0.10"
tokio-test = "0.4.2"
